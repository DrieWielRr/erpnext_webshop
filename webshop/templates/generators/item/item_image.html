{% set column_size = 5 if slides else 4 %}

<style>
    /* Prevent the outer column flex container from causing horizontal layout blowout */
    .col-md-{{ column_size }}.d-flex {
        flex-direction: column;
    }

    .product-carousel {
        width: 100%;
        max-width: 100%;
        min-width: 0; /* Prevents flex child from expanding past column width */
    }

    /* Main Image Box: Standardized to max 400px height with relative positioning for fade overlay */
    .product-carousel-main {
        position: relative;
        width: 100%;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
        border-radius: 6px;
        overflow: hidden;
    }

    /* Absolute positioning & Opacity transition for smooth crossfade */
    .product-carousel-image {
        position: absolute;
        inset: 0;
        margin: auto;
        max-width: 400px;
        max-height: 400px;
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: zoom-in;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
        pointer-events: none;
    }

    .product-carousel-image.active {
        opacity: 1;
        pointer-events: auto;
    }

    .product-carousel-navigation {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 8px;
        margin-top: 12px;
    }

    /* Nav buttons fixed size */
    .carousel-prev,
    .carousel-next {
        flex: 0 0 32px;
        width: 32px;
        height: 60px;
        border: none;
        background: transparent;
        font-size: 28px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        user-select: none;
    }

    /* Thumbnails scrollable viewport */
    .product-carousel-thumbs {
        flex: 1 1 0%;
        min-width: 0;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scroll-behavior: smooth;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .product-carousel-thumbs::-webkit-scrollbar {
        display: none;
    }

    .product-carousel-thumb {
        flex: 0 0 60px;
        width: 60px;
        height: 60px;
        object-fit: cover;
        cursor: pointer;
        opacity: 0.5;
        border: 2px solid transparent;
        border-radius: 6px;
        transition: border-color 0.2s, opacity 0.2s;
    }

    .product-carousel-thumb.active {
        opacity: 1;
        border-color: var(--primary, #007bff);
    }

    .image-zoom-view {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,.85);
        z-index: 1080;
    }

    .image-zoom-view img {
        max-width: 95vw;
        max-height: 95vh;
        object-fit: contain;
    }

    .image-zoom-view button {
        position: absolute;
        right: 3rem;
        top: 2rem;
        z-index: 2;
        font-size: 32px;
        background: transparent;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>

<div class="col-md-{{ column_size }} h-100 d-flex mb-4">

    {% if slides %}

    <div class="product-carousel">

        <!-- Main image -->
        <div class="product-carousel-main">

            {% for item in slides %}

            <img
                class="product-carousel-image {% if loop.first %}active{% endif %}"
                src="{{ item.image }}"
                alt="{{ item.heading }}"
                data-index="{{ loop.index0 }}"
            >

            {% endfor %}

        </div>


        <!-- Thumbnail navigation -->
        <div class="product-carousel-navigation">

            <button type="button" class="carousel-prev" aria-label="Previous">
                ‹
            </button>


            <div class="product-carousel-thumbs">

                {% for item in slides %}

                <img
                    class="product-carousel-thumb {% if loop.first %}active{% endif %}"
                    src="{{ item.image }}"
                    alt="{{ item.heading }}"
                    data-index="{{ loop.index0 }}"
                >

                {% endfor %}

            </div>


            <button type="button" class="carousel-next" aria-label="Next">
                ›
            </button>

        </div>

    </div>


    {% else %}

        {{ product_image(
            doc.website_image,
            alt=doc.website_image_alt or doc.item_name
        ) }}

    {% endif %}


    <!-- Zoom -->
    <div class="image-zoom-view" style="display:none;">
        <button type="button" class="close">
            ×
        </button>
    </div>

</div>


<script>
    frappe.ready(() => {
		document.querySelectorAll(".product-carousel").forEach(carousel => {

			const images = carousel.querySelectorAll(".product-carousel-image");
			const thumbs = carousel.querySelectorAll(".product-carousel-thumb");
			const thumbsContainer = carousel.querySelector(".product-carousel-thumbs");
			const zoomWrapper = document.querySelector(".image-zoom-view");

			if (images.length === 0) return;

			let current = 0;
			let direction = 1; // 1 = forward (|---->), -1 = backward (<----|)
			let autoInterval = null;
			let pauseTimeout = null;

			function activate(index) {
				if (!images[index]) return;

				images.forEach(img => img.classList.remove("active"));
				thumbs.forEach(img => img.classList.remove("active"));

				images[index].classList.add("active");
				thumbs[index].classList.add("active");

				// Smoothly scroll the active thumbnail into view
				if (thumbsContainer && thumbs[index]) {
					thumbs[index].scrollIntoView({
						behavior: "smooth",
						block: "nearest",
						inline: "center"
					});
				}

				current = index;
			}

			// Calculate next index using Ping-Pong (back and forth) logic
			function getNextIndex() {
				if (images.length <= 1) return 0;

				if (direction === 1) {
					if (current < images.length - 1) {
						return current + 1;
					} else {
						direction = -1; // Reverse direction to backward
						return current - 1;
					}
				} else {
					if (current > 0) {
						return current - 1;
					} else {
						direction = 1; // Reverse direction to forward
						return current + 1;
					}
				}
			}

			// Start automatic crossfade every 10 seconds
			function startAutoPlay() {
				stopAutoPlay();
				if (images.length <= 1) return;

				autoInterval = setInterval(() => {
					const nextIndex = getNextIndex();
					activate(nextIndex);
				}, 10000); // 10 seconds
			}

			function stopAutoPlay() {
				if (autoInterval) clearInterval(autoInterval);
				if (pauseTimeout) clearTimeout(pauseTimeout);
			}

			// Pause autoplay for 30 seconds following manual user interaction
			function handleUserInteraction(action) {
				stopAutoPlay();
				action();

				pauseTimeout = setTimeout(() => {
					startAutoPlay();
				}, 30000); // 30-second pause
			}

			// Thumbnail clicks
			thumbs.forEach((thumb, index) => {
				thumb.addEventListener("click", () => {
					handleUserInteraction(() => activate(index));
				});
			});

			// Previous button click
			const prevBtn = carousel.querySelector(".carousel-prev");
			if (prevBtn) {
				prevBtn.onclick = () => {
					handleUserInteraction(() => {
						let prevIndex = current - 1;
						if (prevIndex < 0) prevIndex = images.length - 1;
						activate(prevIndex);
					});
				};
			}

			// Next button click
			const nextBtn = carousel.querySelector(".carousel-next");
			if (nextBtn) {
				nextBtn.onclick = () => {
					handleUserInteraction(() => {
						let nextIndex = current + 1;
						if (nextIndex >= images.length) nextIndex = 0;
						activate(nextIndex);
					});
				};
			}

			// Zoom modal when clicking main image
			images.forEach(image => {
				image.addEventListener("click", () => {
					if (!zoomWrapper) return;

					zoomWrapper.innerHTML = `
						<button type="button" class="close">×</button>
						<img src="${image.src}">
					`;
					zoomWrapper.style.display = "flex";

					zoomWrapper.querySelector(".close").onclick = () => {
						zoomWrapper.style.display = "none";
					};
				});
			});

			// Initialize carousel autoplay on load
			startAutoPlay();
		});

		// Close zoom modal on Escape key press
		document.addEventListener("keydown", (e) => {
			if (e.key === "Escape") {
				const zoomWrapper = document.querySelector(".image-zoom-view");
				if (!zoomWrapper) return;
				zoomWrapper.style.display = "none";
				zoomWrapper.innerHTML = "";
			}
		});
	});
</script>
