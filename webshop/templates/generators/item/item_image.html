{% set column_size = 5 if slides else 4 %}


<style>
	.product-carousel-main {
		width: 100%;
	}

	.product-carousel-image {
		display: none;
		width: 100%;
		height: auto;
		object-fit: contain;
		cursor: zoom-in;
	}

	.product-carousel-image.active {
		display: block;
	}

	.product-carousel-navigation {
		display: flex;
		align-items: center;
		width: 100%;
		gap: 10px;
		margin-top: 12px;
	}

	/* arrows always at edges */
	.carousel-prev,
	.carousel-next {
		flex: 0 0 40px;
		height: 70px;
		border: none;
		background: transparent;
		font-size: 36px;
		cursor: pointer;

		display: flex;
		align-items: center;
		justify-content: center;
	}

	/* thumbnail area gets everything between arrows */
	.product-carousel-thumbs {
		flex: 1;
		min-width: 0;
		display: flex;
		gap: 8px;
		overflow: hidden;
	}

	/* thumbnails */
	.product-carousel-thumb {
		flex: 0 0 70px;
		width: 70px;
		height: 70px;
		object-fit: cover;
		cursor: pointer;
		opacity: .5;
		border: 2px solid transparent;
		border-radius: 6px;
	}

	.product-carousel-thumb.active {
		opacity: 1;
		border-color: var(--primary);
	}

	.image-zoom-view {
		position: fixed;
		inset: 0;
		display: none;
		justify-content: center;
		align-items: center;
		background: rgba(0,0,0,.85);
		z-index: 1080;
	}

	.image-zoom-view img {
		max-width: 95vw;
		max-height: 95vh;
		object-fit: contain;
	}

	.image-zoom-view button {
		position: absolute;
		right: 3rem;
		top: 2rem;
		z-index: 2;
		font-size: 32px;
		background: transparent;
		color: white;
		border: none;
		cursor: pointer;
	}
</style>


<div class="col-md-{{ column_size }} h-100 d-flex mb-4">

	{% if slides %}

	<div class="product-carousel">

		<!-- Main image -->
		<div class="product-carousel-main">

			{% for item in slides %}

			<img
				class="product-carousel-image {% if loop.first %}active{% endif %}"
				src="{{ item.image }}"
				alt="{{ item.heading }}"
				data-index="{{ loop.index0 }}"
			>

			{% endfor %}

		</div>


		<!-- Thumbnail navigation -->
		<div class="product-carousel-navigation">

			<button class="carousel-prev">
				‹
			</button>


			<div class="product-carousel-thumbs">

				{% for item in slides %}

				<img
					class="product-carousel-thumb {% if loop.first %}active{% endif %}"
					src="{{ item.image }}"
					alt="{{ item.heading }}"
					data-index="{{ loop.index0 }}"
				>

				{% endfor %}

			</div>


			<button class="carousel-next">
				›
			</button>

		</div>

	</div>


	{% else %}

		{{ product_image(
			doc.website_image,
			alt=doc.website_image_alt or doc.item_name
		) }}

	{% endif %}


	<!-- Zoom -->
	<div class="image-zoom-view" style="display:none;">
		<button type="button" class="close">
			×
		</button>
	</div>


</div>


<script>
	frappe.ready(() => {
		document.querySelectorAll(".product-carousel").forEach(carousel => {

			const images = carousel.querySelectorAll(
				".product-carousel-image"
			);

			const thumbs = carousel.querySelectorAll(
				".product-carousel-thumb"
			);

			const zoomWrapper = document.querySelector(				
				".image-zoom-view"
			);

			const mainImages =
				carousel.querySelectorAll(
					".product-carousel-image"
				);


			mainImages.forEach(image => {

				image.addEventListener(
					"click",
					() => {

						if (!zoomWrapper) {
							return;
						}

						zoomWrapper.innerHTML = `
							<button type="button" class="close">
								×
							</button>
							<img src="${image.src}">
						`;

						zoomWrapper.style.display = "flex";


						zoomWrapper
							.querySelector(".close")
							.onclick = () => {
								zoomWrapper.style.display = "none";
							};
					}
				);

			});

			let current = 0;
			function activate(index) {

				if (!images[index]) {
					return;
				}

				images.forEach(img =>
					img.classList.remove("active")
				);

				thumbs.forEach(img =>
					img.classList.remove("active")
				);


				images[index].classList.add("active");
				thumbs[index].classList.add("active");

				current = index;
			}


			thumbs.forEach((thumb, index) => {

				thumb.addEventListener(
					"click",
					() => activate(index)
				);

			});


			carousel
				.querySelector(".carousel-prev")
				.onclick = () => {

					activate(
						current > 0
						? current - 1
						: images.length - 1
					);

				};


			carousel
				.querySelector(".carousel-next")
				.onclick = () => {

					activate(
						current < images.length - 1
						? current + 1
						: 0
					);

				};
		});

		document.addEventListener(
			"keydown",
			(e) => {

				if (e.key !== "Escape") {
					return;
				}

				const zoomWrapper =
					document.querySelector(".image-zoom-view");

				if (!zoomWrapper) {
					return;
				}

				zoomWrapper.style.display = "none";
				zoomWrapper.innerHTML = "";

			}
		);
	});	
</script>
