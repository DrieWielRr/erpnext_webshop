{% set column_size = 5 if slides else 4 %}

<style>
	/* Prevent the outer column flex container from causing horizontal layout blowout */
	.col-md-{{ column_size }}.d-flex {
		flex-direction: column;
	}

	.product-carousel {
		width: 100%;
		max-width: 100%;
		min-width: 0; /* Prevents flex child from expanding past column width */
	}

	/* Main Image Box: Standardized to max 200x200px to stop layout shifts */
	.product-carousel-main {
		width: 100%;
		height: 400px;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #f8f9fa; /* Optional background for padding transparent/smaller images */
		border-radius: 6px;
		overflow: hidden;
	}

	.product-carousel-image {
		display: none;
		max-width: 400px;
		max-height: 400px;
		width: 100%;
		height: 100%;
		object-fit: contain; /* Prevents distortion & maintains aspect ratio within 200x200 */
		cursor: zoom-in;
	}

	.product-carousel-image.active {
		display: block;
	}

	.product-carousel-navigation {
		display: flex;
		align-items: center;
		width: 100%;
		gap: 8px;
		margin-top: 12px;
	}

	/* Nav buttons fixed size */
	.carousel-prev,
	.carousel-next {
		flex: 0 0 32px;
		width: 32px;
		height: 60px;
		border: none;
		background: transparent;
		font-size: 28px;
		cursor: pointer;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 0;
		user-select: none;
	}

	/* Thumbnails scrollable viewport */
	.product-carousel-thumbs {
		flex: 1 1 0%;
		min-width: 0; /* Crucial: allows thumbnail container to shrink below content width */
		display: flex;
		gap: 8px;
		overflow-x: auto;
		scroll-behavior: smooth;
		scrollbar-width: none; /* Hide scrollbar Firefox */
		-ms-overflow-style: none; /* Hide scrollbar IE/Edge */
	}

	.product-carousel-thumbs::-webkit-scrollbar {
		display: none; /* Hide scrollbar Chrome/Safari */
	}

	.product-carousel-thumb {
		flex: 0 0 60px;
		width: 60px;
		height: 60px;
		object-fit: cover;
		cursor: pointer;
		opacity: 0.5;
		border: 2px solid transparent;
		border-radius: 6px;
		transition: border-color 0.2s, opacity 0.2s;
	}

	.product-carousel-thumb.active {
		opacity: 1;
		border-color: var(--primary, #007bff);
	}

	.image-zoom-view {
		position: fixed;
		inset: 0;
		display: none;
		justify-content: center;
		align-items: center;
		background: rgba(0,0,0,.85);
		z-index: 1080;
	}

	.image-zoom-view img {
		max-width: 95vw;
		max-height: 95vh;
		object-fit: contain;
	}

	.image-zoom-view button {
		position: absolute;
		right: 3rem;
		top: 2rem;
		z-index: 2;
		font-size: 32px;
		background: transparent;
		color: white;
		border: none;
		cursor: pointer;
	}
</style>

<div class="col-md-{{ column_size }} h-100 d-flex mb-4">

	{% if slides %}

	<div class="product-carousel">

		<!-- Main image -->
		<div class="product-carousel-main">

			{% for item in slides %}

			<img
				class="product-carousel-image {% if loop.first %}active{% endif %}"
				src="{{ item.image }}"
				alt="{{ item.heading }}"
				data-index="{{ loop.index0 }}"
			>

			{% endfor %}

		</div>


		<!-- Thumbnail navigation -->
		<div class="product-carousel-navigation">

			<button type="button" class="carousel-prev" aria-label="Previous">
				‹
			</button>


			<div class="product-carousel-thumbs">

				{% for item in slides %}

				<img
					class="product-carousel-thumb {% if loop.first %}active{% endif %}"
					src="{{ item.image }}"
					alt="{{ item.heading }}"
					data-index="{{ loop.index0 }}"
				>

				{% endfor %}

			</div>


			<button type="button" class="carousel-next" aria-label="Next">
				›
			</button>

		</div>

	</div>


	{% else %}

		{{ product_image(
			doc.website_image,
			alt=doc.website_image_alt or doc.item_name
		) }}

	{% endif %}


	<!-- Zoom -->
	<div class="image-zoom-view" style="display:none;">
		<button type="button" class="close">
			×
		</button>
	</div>

</div>


<script>
	frappe.ready(() => {
		document.querySelectorAll(".product-carousel").forEach(carousel => {

			const images = carousel.querySelectorAll(".product-carousel-image");
			const thumbs = carousel.querySelectorAll(".product-carousel-thumb");
			const thumbsContainer = carousel.querySelector(".product-carousel-thumbs");
			const zoomWrapper = document.querySelector(".image-zoom-view");

			let current = 0;

			function activate(index) {
				if (!images[index]) return;

				images.forEach(img => img.classList.remove("active"));
				thumbs.forEach(img => img.classList.remove("active"));

				images[index].classList.add("active");
				thumbs[index].classList.add("active");

				// Automatically scroll active thumbnail smoothly into view
				if (thumbsContainer && thumbs[index]) {
					thumbs[index].scrollIntoView({
						behavior: "smooth",
						block: "nearest",
						inline: "center"
					});
				}

				current = index;
			}

			thumbs.forEach((thumb, index) => {
				thumb.addEventListener("click", () => activate(index));
			});

			carousel.querySelector(".carousel-prev").onclick = () => {
				activate(current > 0 ? current - 1 : images.length - 1);
			};

			carousel.querySelector(".carousel-next").onclick = () => {
				activate(current < images.length - 1 ? current + 1 : 0);
			};

			images.forEach(image => {
				image.addEventListener("click", () => {
					if (!zoomWrapper) return;

					zoomWrapper.innerHTML = `
						<button type="button" class="close">×</button>
						<img src="${image.src}">
					`;
					zoomWrapper.style.display = "flex";

					zoomWrapper.querySelector(".close").onclick = () => {
						zoomWrapper.style.display = "none";
					};
				});
			});
		});

		document.addEventListener("keydown", (e) => {
			if (e.key === "Escape") {
				const zoomWrapper = document.querySelector(".image-zoom-view");
				if (!zoomWrapper) return;
				zoomWrapper.style.display = "none";
				zoomWrapper.innerHTML = "";
			}
		});
	});	
</script>
